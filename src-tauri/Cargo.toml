[package]
name = "island"
version = "0.7.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
windows-future = "0.3"
windows-core = "0.62"
rusqlite = { version = "0.32", features = ["bundled"] }
drag = "2"
windows = { version = "0.62", features = [
  "Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams",
  "Win32_Foundation", "Win32_System_Com", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_TextServices",
  "Win32_System_Power", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_System_Wmi", "Win32_System_Variant",
  "Win32_Globalization", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Rpc",
  "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug", "Win32_UI_Accessibility", "Win32_System_LibraryLoader", "Win32_UI_Notifications", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_System_SystemServices", "Win32_System_Com_StructuredStorage"
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
