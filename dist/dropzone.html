<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Island drop</title>
<style>
/* Invisible: the island underneath draws the drop zone, this window only catches the files. */
html,body{margin:0;height:100%;background:rgba(0,0,0,.01);overflow:hidden}
</style>
</head>
<body>
<script>
(function(){
  const TA = window.__TAURI__; if (!TA) return;
  const tell = on => TA.event.emitTo('island', 'drag-near', {on, hot: on});
  TA.event.listen('tauri://drag-enter', () => tell(true));
  TA.event.listen('tauri://drag-drop', e => {
    const paths = (e.payload && e.payload.paths) || [];
    if (paths.length) TA.core.invoke('shelf_drop', {paths});
  });
})();
</script>
</body>
</html>
